<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf7f2"/>
    </linearGradient>
    <radialGradient id="postFill" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#d4851f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4851f" stop-opacity="0.10"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4851f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#bg)"/>
  <text x="44" y="48" fill="#b98a3f" font-size="13" font-weight="700" letter-spacing="3">SKILL INFERENCE</text>
  <text x="44" y="70" fill="#8a8f98" font-size="13.5">Each observation updates a person's whole skill profile — sharpening toward the truth (dotted)</text>

  <!-- progress dots -->
  <text x="792" y="48" text-anchor="end" fill="#a89a80" font-size="11" letter-spacing="1">OBSERVATIONS</text>
  <circle cx="812" cy="44" r="5" fill="#e3ddce">
    <animate attributeName="fill" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.16;0.20;0.94;1" values="#e3ddce;#e3ddce;#d4851f;#d4851f;#e3ddce"/>
  </circle>
  <circle cx="832" cy="44" r="5" fill="#e3ddce">
    <animate attributeName="fill" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.38;0.42;0.94;1" values="#e3ddce;#e3ddce;#d4851f;#d4851f;#e3ddce"/>
  </circle>
  <circle cx="852" cy="44" r="5" fill="#e3ddce">
    <animate attributeName="fill" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.60;0.64;0.94;1" values="#e3ddce;#e3ddce;#d4851f;#d4851f;#e3ddce"/>
  </circle>

  <!-- grid rings -->
  <g fill="none" stroke="#e7e1d6" stroke-width="1.2">
    <circle cx="450" cy="252" r="43.75"/>
    <circle cx="450" cy="252" r="87.5"/>
    <circle cx="450" cy="252" r="131.25"/>
    <circle cx="450" cy="252" r="175"/>
  </g>
  <!-- spokes -->
  <g stroke="#e7e1d6" stroke-width="1.2">
    <line x1="450" y1="252" x2="450" y2="77"/>
    <line x1="450" y1="252" x2="573.7" y2="128.3"/>
    <line x1="450" y1="252" x2="625" y2="252"/>
    <line x1="450" y1="252" x2="573.7" y2="375.7"/>
    <line x1="450" y1="252" x2="450" y2="427"/>
    <line x1="450" y1="252" x2="326.3" y2="375.7"/>
    <line x1="450" y1="252" x2="275" y2="252"/>
    <line x1="450" y1="252" x2="326.3" y2="128.3"/>
  </g>

  <!-- axis labels -->
  <g fill="#6b7280" font-size="13" font-weight="500">
    <text x="450" y="55" text-anchor="middle">Mathematics</text>
    <text x="591" y="112" text-anchor="start">Science</text>
    <text x="649" y="256" text-anchor="start">Problem Solving</text>
    <text x="591" y="393" text-anchor="start">Active Learning</text>
    <text x="450" y="449" text-anchor="middle">Systems Eval.</text>
    <text x="309" y="393" text-anchor="end">Visual Discrim.</text>
    <text x="251" y="256" text-anchor="end">Manual Dexterity</text>
    <text x="309" y="112" text-anchor="end">Static Strength</text>
  </g>

  <!-- target (true) profile -->
  <polygon points="450,94.5 539.1,162.9 586.5,252 536.62,338.62 450,381.5 388.13,313.87 397.5,252 417.83,219.83"
           fill="none" stroke="#4b4b4b" stroke-width="1.6" stroke-dasharray="2 5"
           stroke-linejoin="round" stroke-linecap="round" opacity="0.4"/>

  <!-- prior profile (static reference) -->
  <polygon points="450,164.5 511.87,190.13 537.5,252 511.87,313.87 450,339.5 388.13,313.87 362.5,252 388.13,190.13"
           fill="#9aa0a8" fill-opacity="0.08" stroke="#9aa0a8" stroke-width="2"
           stroke-dasharray="6 5" stroke-linejoin="round"/>

  <!-- posterior profile: prior -> A -> B -> C -> reset -->
  <polygon fill="url(#postFill)" stroke="#d4851f" stroke-width="3" stroke-linejoin="round" filter="url(#soft)"
           points="450,164.5 511.87,190.13 537.5,252 511.87,313.87 450,339.5 388.13,313.87 362.5,252 388.13,190.13">
    <animate attributeName="points" dur="9s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.08;0.20;0.30;0.42;0.52;0.64;0.86;1"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
      values="450,164.5 511.87,190.13 537.5,252 511.87,313.87 450,339.5 388.13,313.87 362.5,252 388.13,190.13;
              450,164.5 511.87,190.13 537.5,252 511.87,313.87 450,339.5 388.13,313.87 362.5,252 388.13,190.13;
              450,103.25 526.72,175.28 562,252 524.25,326.25 450,360.5 389.37,312.63 376.5,252 400.5,202.5;
              450,103.25 526.72,175.28 562,252 524.25,326.25 450,360.5 389.37,312.63 376.5,252 400.5,202.5;
              450,101.5 530.43,171.57 567.25,252 527.96,329.96 450,365.75 388.13,313.87 395.75,252 412.88,214.88;
              450,101.5 530.43,171.57 567.25,252 527.96,329.96 450,365.75 388.13,313.87 395.75,252 412.88,214.88;
              450,96.25 537.86,164.14 584.75,252 537.86,339.86 450,379.75 388.13,313.87 397.5,252 416.59,218.59;
              450,96.25 537.86,164.14 584.75,252 537.86,339.86 450,379.75 388.13,313.87 397.5,252 416.59,218.59;
              450,164.5 511.87,190.13 537.5,252 511.87,313.87 450,339.5 388.13,313.87 362.5,252 388.13,190.13"/>
  </polygon>

  <!-- Observation 1: Mathematics -->
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.16;0.20;0.94;1" values="0;0;1;1;0"/>
    <circle cx="450" cy="94.5" r="6" fill="#d4851f" opacity="0.5">
      <animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="6;22;6"/>
      <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="0.5;0;0.5"/>
    </circle>
    <polygon points="450,82.5 452.94,90.45 461.41,90.79 454.76,96.05 457.05,104.21 450,99.5 442.95,104.21 445.24,96.05 438.59,90.79 447.06,90.45"
             fill="#d4851f" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <g transform="translate(474,80)">
      <rect x="0" y="0" width="72" height="26" rx="13" fill="#d4851f"/>
      <text x="36" y="17.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">y = 0.90</text>
    </g>
  </g>

  <!-- Observation 2: Manual Dexterity -->
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.38;0.42;0.94;1" values="0;0;1;1;0"/>
    <circle cx="401" cy="252" r="6" fill="#d4851f" opacity="0.5">
      <animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="6;22;6"/>
      <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="0.5;0;0.5"/>
    </circle>
    <polygon points="401,240 403.94,247.95 412.41,248.29 405.76,253.55 408.05,261.71 401,257 393.95,261.71 396.24,253.55 389.59,248.29 398.06,247.95"
             fill="#d4851f" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <g transform="translate(300,239)">
      <rect x="0" y="0" width="72" height="26" rx="13" fill="#d4851f"/>
      <text x="36" y="17.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">y = 0.28</text>
    </g>
  </g>

  <!-- Observation 3: Active Learning -->
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.60;0.64;0.94;1" values="0;0;1;1;0"/>
    <circle cx="539.1" cy="341.1" r="6" fill="#d4851f" opacity="0.5">
      <animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="6;22;6"/>
      <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="0.5;0;0.5"/>
    </circle>
    <polygon points="539.1,329.1 542.04,337.05 550.51,337.39 543.86,342.65 546.15,350.81 539.1,346.1 532.05,350.81 534.34,342.65 527.69,337.39 536.16,337.05"
             fill="#d4851f" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <g transform="translate(553,350)">
      <rect x="0" y="0" width="72" height="26" rx="13" fill="#d4851f"/>
      <text x="36" y="17.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">y = 0.72</text>
    </g>
  </g>

  <!-- human subject at the centre of the profile -->
  <g filter="url(#soft)">
    <circle cx="450" cy="252" r="23" fill="#ffffff" stroke="#e6d7bf" stroke-width="1.5"/>
    <circle cx="450" cy="246.5" r="6.2" fill="#d4851f"/>
    <path d="M438.5 263.5 a11.5 9.5 0 0 1 23 0 Z" fill="#d4851f"/>
  </g>
  <text x="450" y="252" dy="34" text-anchor="middle" fill="#a8825a" font-size="10.5" font-weight="600" letter-spacing="1.5">HUMAN EXPERT</text>

  <!-- legend -->
  <g font-size="13.5" fill="#5f636b">
    <line x1="170" y1="520" x2="206" y2="520" stroke="#9aa0a8" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="214" y="525" text-anchor="start">Prior</text>

    <line x1="300" y1="520" x2="336" y2="520" stroke="#4b4b4b" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="344" y="525" text-anchor="start">Target (true)</text>

    <line x1="500" y1="520" x2="536" y2="520" stroke="#d4851f" stroke-width="3.5"/>
    <text x="544" y="525" text-anchor="start">Posterior</text>

    <polygon points="670,513 672.35,519.4 679.13,519.67 673.81,523.84 675.64,530.37 670,526.6 664.36,530.37 666.19,523.84 660.87,519.67 667.65,519.4"
             fill="#d4851f"/>
    <text x="686" y="525" text-anchor="start">Observation</text>
  </g>
</svg>
