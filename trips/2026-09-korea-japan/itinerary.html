<style id="gate-style">
  /* Every rule is scoped under #gate, and this whole element is removed once the
     real document mounts. The page brings its own reset and styles, and nothing
     here may bleed into it. Palette is the site's own design system. */
  html, body.gate-body { margin: 0; height: 100%; }
  body.gate-body {
    background: #FFFDFB; color: #17181C;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px; line-height: 1.7; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  #gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
  #gate * { box-sizing: border-box; }
  #gate .card {
    width: 100%; max-width: 420px; background: #FFFFFF;
    border: 1px solid #DBD8CF; border-radius: 14px;
    padding: 34px 32px 30px; box-shadow: 0 18px 46px -28px rgba(23,24,28,0.28);
  }
  #gate .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #E8590C; margin: 0 0 14px;
  }
  #gate h1 {
    font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    font-size: 24px; line-height: 1.25; letter-spacing: -0.02em;
    font-weight: 600; margin: 0 0 10px;
  }
  #gate p.sub { margin: 0 0 22px; font-size: 15px; line-height: 1.6; color: #5C5B54; }
  #gate label { display: block; font-size: 13px; font-weight: 500; color: #5C5B54; margin-bottom: 7px; }
  #gate input {
    width: 100%; padding: 11px 13px; font: inherit; font-size: 16px;
    color: #17181C; background: #FBF4EF;
    border: 1px solid #DBD8CF; border-radius: 9px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #gate input:focus { border-color: #E8590C; box-shadow: 0 0 0 3px rgba(232,89,12,0.12); background: #FFFFFF; }
  #gate button {
    margin-top: 14px; width: 100%; padding: 11px 16px; font: inherit; font-size: 15px;
    font-weight: 500; color: #FFFDFB; background: #E8590C;
    border: 1px solid #E8590C; border-radius: 9px; cursor: pointer;
    transition: background .15s;
  }
  #gate button:hover:not(:disabled) { background: #C4470A; border-color: #C4470A; }
  #gate button:disabled { opacity: .62; cursor: default; }
  #gate .msg { min-height: 20px; margin: 12px 0 0; font-size: 13.5px; color: #C4470A; }
  #gate .msg.quiet { color: #9A998F; }
  #gate .foot {
    margin: 22px 0 0; padding-top: 16px; border-top: 1px solid rgba(23,24,28,0.06);
    font-size: 12.5px; line-height: 1.55; color: #9A998F;
  }
  @media (prefers-color-scheme: dark) {
    body.gate-body { background: #17181C; color: #F2F0EC; }
    #gate .card { background: #1E1F24; border-color: #33343A; box-shadow: none; }
    #gate p.sub, #gate label { color: #A8A69E; }
    #gate input { background: #17181C; color: #F2F0EC; border-color: #33343A; }
    #gate input:focus { background: #17181C; }
    #gate .foot { color: #7C7A73; border-top-color: rgba(255,255,255,0.08); }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  var env = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate-form');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var msg = document.getElementById('msg');
  var PW_STORE = 'trips.private.pw';
  var KEY_STORE = 'trips.private.key.' + env.kdf.salt;   // per-build, per-salt

  function say(text, quiet) {
    msg.textContent = text || '';
    msg.className = 'msg' + (quiet ? ' quiet' : '');
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToB64(buf) {
    var bytes = new Uint8Array(buf), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function gunzip(bytes) {
    if (typeof DecompressionStream !== 'function') {
      return Promise.reject(new Error('unsupported-browser'));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  // Every page in this build shares one salt, so the 600k-iteration derivation
  // happens once per tab and every later page imports the cached key directly.
  // Without this, each click through the site would stall for ~a second.
  function deriveKey(password) {
    var cached = null;
    try { cached = sessionStorage.getItem(KEY_STORE); } catch (e) {}
    if (cached) {
      return crypto.subtle.importKey(
        'raw', b64ToBytes(cached), { name: 'AES-GCM' }, true, ['decrypt']
      );
    }
    var enc = new TextEncoder();
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (baseKey) {
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: b64ToBytes(env.kdf.salt),
            iterations: env.kdf.iterations,
            hash: env.kdf.hash
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          true,
          ['decrypt']
        );
      });
  }

  // Decrypt with the password. Rejects on a wrong password: AES-GCM's auth tag
  // fails before any plaintext exists, so there is nothing partial to leak.
  function decrypt(password) {
    var theKey;
    return deriveKey(password)
      .then(function (key) {
        theKey = key;
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBytes(env.cipher.iv) },
          key,
          b64ToBytes(env.ct)
        );
      })
      .then(function (buf) {
        return crypto.subtle.exportKey('raw', theKey).then(function (raw) {
          // Only cached once a decrypt has actually succeeded, so a wrong
          // password can never poison the cache for the rest of the session.
          try { sessionStorage.setItem(KEY_STORE, bytesToB64(raw)); } catch (e) {}
          return gunzip(new Uint8Array(buf));
        });
      });
  }

  // Swap the gate for the real document. The page's inline scripts each expect
  // the markup above them to exist and originally ran at parse time, so we walk
  // the parsed nodes in order and execute scripts as we reach them — same
  // ordering the browser would have given them — then fire the lifecycle events
  // that already came and went for this document.
  function mount(html) {
    var parsed = new DOMParser().parseFromString(html, 'text/html');
    var i, nodes;

    document.getElementById('payload').remove();
    document.getElementById('gate').remove();
    document.getElementById('gate-style').remove();
    document.body.className = '';

    nodes = Array.prototype.slice.call(parsed.head.childNodes);
    for (i = 0; i < nodes.length; i++) {
      if (nodes[i].nodeName === 'TITLE') continue;
      document.head.appendChild(document.importNode(nodes[i], true));
    }

    nodes = Array.prototype.slice.call(parsed.body.childNodes);
    for (i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node.nodeName === 'SCRIPT') {
        var script = document.createElement('script');
        for (var a = 0; a < node.attributes.length; a++) {
          script.setAttribute(node.attributes[a].name, node.attributes[a].value);
        }
        script.textContent = node.textContent;
        document.body.appendChild(script);   // executes synchronously
      } else {
        document.body.appendChild(document.importNode(node, true));
      }
    }

    // The gate's title is deliberately generic; restore the page's real one now
    // that the page is only visible to someone who had the password.
    if (parsed.title) document.title = parsed.title;

    document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    window.dispatchEvent(new Event('load'));
  }

  function attempt(password, remembered) {
    button.disabled = true;
    input.disabled = true;
    say('Decrypting…', true);

    return decrypt(password).then(
      function (html) {
        try { sessionStorage.setItem(PW_STORE, password); } catch (e) {}
        mount(html);
      },
      function (err) {
        button.disabled = false;
        input.disabled = false;
        try {
          sessionStorage.removeItem(PW_STORE);
          sessionStorage.removeItem(KEY_STORE);
        } catch (e) {}
        if (err && err.message === 'unsupported-browser') {
          say('This browser is too old to open these pages. Try a current Chrome, Safari, Firefox, or Edge.');
        } else if (remembered) {
          say('');
        } else {
          say('That password is not right.');
          input.value = '';
          input.focus();
        }
      }
    );
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var password = input.value;
    if (password) attempt(password, false);
  });

  // Re-unlock silently within the same tab session, so navigating between pages,
  // reloading, and deep links do not re-prompt.
  var saved = null;
  try { saved = sessionStorage.getItem(PW_STORE); } catch (e) {}
  if (saved) attempt(saved, true); else input.focus();
})();
</script>
</body>
</html>
